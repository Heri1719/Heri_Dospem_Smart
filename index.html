<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="RisetFlow AI" />
    <meta property="og:description" content="AI Research Assistant untuk membantu mahasiswa S1 dan S2 menyusun penelitian secara sistematis dari ide menjadi proposal penelitian dan draf Bab 1." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <script>
      (function () {
        // Suppress console error noise generated by third-party browser wallet extensions (e.g. MetaMask)
        try {
          var originalConsoleError = console.error;
          console.error = function () {
            var args = Array.prototype.slice.call(arguments);
            var text = args
              .map(function (item) {
                if (!item) return '';
                if (typeof item === 'string') return item;
                if (item.message) return item.message;
                if (item.stack) return item.stack;
                try {
                  return JSON.stringify(item);
                } catch (_) {
                  return String(item);
                }
              })
              .join(' ');

            if (/metamask|ethereum|failed to connect to metamask/i.test(text)) {
              return;
            }
            return originalConsoleError.apply(console, arguments);
          };

          var originalConsoleWarn = console.warn;
          console.warn = function () {
            var args = Array.prototype.slice.call(arguments);
            var text = args
              .map(function (item) {
                if (!item) return '';
                if (typeof item === 'string') return item;
                if (item.message) return item.message;
                return String(item);
              })
              .join(' ');

            if (/metamask|ethereum|failed to connect to metamask/i.test(text)) {
              return;
            }
            return originalConsoleWarn.apply(console, arguments);
          };
        } catch (_) {}

        // Suppress unhandled rejection & window errors from MetaMask or other injected wallet scripts
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = (e && e.reason && (e.reason.message || e.reason.stack || e.reason)) || '';
            if (/metamask|ethereum|failed to connect/i.test(String(reason))) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );

        window.addEventListener(
          'error',
          function (e) {
            var msg = (e && (e.message || (e.error && e.error.message))) || '';
            if (/metamask|ethereum|failed to connect/i.test(String(msg))) {
              if (e.preventDefault) e.preventDefault();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
